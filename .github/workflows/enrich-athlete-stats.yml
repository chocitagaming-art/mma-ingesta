name: Enrich athlete finish stats (ufc.com)

# Scrapes each fighter's career finish stats — Wins by KO, Wins by Submission,
# First Round Finishes — from their ufc.com athlete page and stores them
# (migration 021). The hero tiles used to be computed only from UFC fights, so a
# fighter whose finishes are pre-UFC/regional showed 0/0/0 while ufc.com carries
# the CAREER totals (Anna Melisano: profile 0/0/0 vs ufc.com 2/1/2). New-value-
# wins: the freshest scrape replaces the stored value (totals only grow), so
# without this cron the figures would freeze after a bout — the same class of
# bug as refresh-records. No Claude tokens (no translation); only DATABASE_URL.
# Default scope (daily cron) = fighters on UPCOMING cards (small, ~1-2 min).
# Monthly cron / manual all=true sweeps the whole table: ~2.9k pages, 27-32 min
# measured (0.57-0.67 s per fighter = 0.4 s delay + ufc.com), plus an estimated
# ~0.3 s (BEGIN + COMMIT, two round trips to Neon) for every no-op UPDATE (~48%
# of the fighters) now that each fighter commits. Hence timeout-minutes 90: 30
# cancelled the 1-sep (run 33488770710) and 1-oct (run 36848270600) sweeps.
# tests/test_enrich_sweep_workflows.py keeps these figures honest.
# Since migration 032 the same page also yields the fighter's Instagram and X
# (JSON-LD Person.sameAs, never the footer's @ufc): zero extra requests, one
# more UPDATE per verified page (IS DISTINCT FROM, so a no-op when unchanged).
# First fill of those links = manual dispatch with all=true (dry_run=true first
# to see the counts: with_socials / with_instagram / with_x).
# Daily 08:15 UTC: after refresh-records (08:00) and event-night live-results
# seals, clear of the ufc.com photo/facts crawlers (05:00-06:30).
on:
  schedule:
    - cron: "15 8 * * *"     # diario 08:15 UTC: solo carteleras proximas
    - cron: "30 3 1 * *"     # dia 1 de cada mes 03:30 UTC -> barrido --all
  workflow_dispatch:
    inputs:
      limit:
        description: "Max fighters to process (empty = all in scope)"
        required: false
        default: ""
      offset:
        description: "Skip first N fighters (chunk --all with --limit)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run: resolve + report, no writes"
        type: boolean
        default: false
      all:
        description: "Whole-table scope, not just upcoming cards"
        type: boolean
        default: false

concurrency:
  group: enrich-athlete-stats
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      # La MISMA pagina trae el Instagram y el X del luchador (JSON-LD
      # Person.sameAs, migracion 032). La 032 es aditiva e idempotente, pero se
      # aplica SOLO si aun faltan sus dos columnas o sus dos CHECK: asi el cron
      # diario no toma un candado de tabla sobre fighters cada manana por nada.
      # Si el psql falla (lock_timeout de 10 s), el job sale en rojo y avisa
      # notify-on-failure. Si no se aplicara, el script seguiria igual: refresca
      # las estadisticas y solo cuenta las redes (socials_columns_missing=1).
      - name: Apply migration 032 if missing (additive, idempotent)
        if: ${{ !inputs.dry_run }}
        run: |
          HAVE=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "
            SELECT (SELECT count(*) FROM information_schema.columns
                     WHERE table_schema = current_schema() AND table_name = 'fighters'
                       AND column_name IN ('instagram_url', 'x_url'))
                 + (SELECT count(*) FROM pg_constraint
                     WHERE conrelid = 'fighters'::regclass
                       AND conname IN ('fighters_instagram_url_format', 'fighters_x_url_format'))")
          if [ "$HAVE" = "4" ]; then
            echo "Migration 032 already applied (columns + CHECKs present)."
          else
            echo "Applying migration 032 (found $HAVE of 4 objects)."
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction \
              -f db/migrations/032_fighter_social_links.sql
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run athlete finish-stats enrichment
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # El cron mensual (dia 1) refresca TODA la tabla; el diario sigue
            # acotado a carteleras proximas (barato). New-value-wins: solo
            # reescribe lo que cambio (IS DISTINCT FROM).
            if [ "${{ github.event.schedule }}" = "30 3 1 * *" ]; then ARGS="--all"; fi
          else
            if [ -n "${{ inputs.limit || '' }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
            if [ -n "${{ inputs.offset || '' }}" ]; then ARGS="$ARGS --offset ${{ inputs.offset }}"; fi
            if [ "${{ inputs.dry_run || false }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.all || false }}" = "true" ]; then ARGS="$ARGS --all"; fi
          fi
          python -m src.scrapers.enrich_athlete_stats $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
