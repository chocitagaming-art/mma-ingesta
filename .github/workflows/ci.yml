name: CI

# Runs the test suite on every push / PR to main. No secrets: the tests mock the
# database and all network calls (see tests/conftest.py), so nothing here touches
# Neon or the live scrape targets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Postgres de usar y tirar para los tests de integración. NO hace falta el
      # esquema de producción: test_db_pool solo hace SELECT pg_backend_pid() y
      # test_upcoming_fmid_dedup crea su propia TEMP TABLE que sombrea `fights`.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-service.txt
            requirements-scrapers.txt
            requirements-dev.txt
      - name: Install dependencies
        # requirements.txt covers the scraper + ML stack; requirements-service.txt
        # adds fastapi/joblib needed by the prediction-service tests; -dev adds the
        # test runner + linter. `from src... import` resolves via pythonpath=["."]
        # in pyproject.toml, so the package itself doesn't need to be installed.
        #
        # requirements-scrapers.txt is what the 23 scraper crons actually run on,
        # and it is the ONLY one carrying curl_cffi — the Chrome TLS-fingerprint
        # impersonation that ESPN Deportes and ufcespanol need. It was missing
        # here, so a pinned version that stopped resolving (new Python, no wheel)
        # would have taken every scraper cron down with CI still green.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-service.txt -r requirements-scrapers.txt -r requirements-dev.txt
      - name: Lint — bugs reales (BLOQUEANTE)
        # F7: la categoria F de ruff (imports sin usar, nombres indefinidos,
        # variables sin usar, f-strings sin placeholder...) SI bloquea, ahora
        # tambien sobre tests/. El estilo (E501 lineas largas, etc.) sigue como
        # reporte no bloqueante: el repo arrastra ~900 E501 de SQL/strings largos
        # y enforzarlos seria puro ruido sin valor.
        run: ruff check --select F src/ tests/
      - name: Estilo (no bloqueante)
        run: ruff check src/ tests/ || true
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Tests de integración contra Postgres
        # A propósito NO se exporta DATABASE_URL al paso anterior: hay 12 ficheros
        # de test que miran esa variable y algunos esperan datos REALES, así que
        # ponerla global despertaría tests que fallarían contra una base vacía.
        # Aquí se apunta solo a los dos que necesitan un Postgres de verdad.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mma_test
        run: |
          set -euo pipefail
          output=$(python -m pytest tests/test_db_pool.py tests/test_upcoming_fmid_dedup.py -v -rs)
          echo "$output"
          # Estos tests se auto-saltan si falta DATABASE_URL. Un "skipped" aquí
          # significaría que el servicio de Postgres no llegó, y el paso pasaría
          # en verde sin haber comprobado NADA — que es justo el agujero que
          # este paso viene a tapar.
          if echo "$output" | grep -qE '[0-9]+ skipped'; then
            echo "::error::Los tests de integración se saltaron pese a haber un Postgres levantado."
            exit 1
          fi
