name: Refresh news

# Pulls the latest MMA news from the configured RSS feeds (see RSS_FEEDS in
# src/scrapers/news.py: ESPN Deportes, Marca, UFC Español), grabs each article's
# image (og:image) and classifies it with Claude. Needs ANTHROPIC_API_KEY for the
# classification step in addition to the DB. Writes to Neon.
# After a successful scrape it POSTs to the app's /api/revalidate so the home
# page (ISR 30 min) picks up the fresh headlines within seconds.
on:
  schedule:
    # 3x/day at :05 — a minute no other workflow in this repo uses (the :10
    # grid collides with live-results and keepalive-prediction every 10 min).
    - cron: "5 8,14,21 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Run news scraper
        run: python -m src.scrapers.news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Rescatar imagenes que faltaron (best-effort)
        # El scraper de arriba se salta las URLs que ya existen (news.py:96-99),
        # asi que una fila que entro sin imagen NO la recupera nunca aunque el
        # articulo empiece a servir og:image mas tarde — que es justo lo que
        # paso con la noticia 231 del 24-jul. Este script ya existia con su CLI
        # y no estaba enganchado a ningun workflow. Va DESPUES del scraper (para
        # coger tambien lo recien insertado) y ANTES del revalidate (para que la
        # home publique ya las imagenes rescatadas). --limit acota el gasto de
        # red: son pocas filas y cada pasada reintenta las que queden.
        continue-on-error: true
        run: python -m src.scrapers.backfill_news_images --limit 25
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Revalidate home page
        run: |
          curl -fsS -X POST "https://mma-app-ruby.vercel.app/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -o /dev/null -w "revalidate: HTTP %{http_code}\n"
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
