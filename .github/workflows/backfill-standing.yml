name: Backfill standing photos

# Backfill (redesign round A): fills fighters.standing_body_url from the
# standing full-body photo each ufc.com event bout view serves per corner.
# Sweeps events with source='ufc.com' (upcoming AND completed — their pages stay
# live) newest first. The newest scraped value wins (UFC refreshes the photo
# after every fight) but NULL/empty never overwrites a stored value, so
# re-dispatching is always safe.
# Weekly cron (Mondays 07:00 UTC, after the 06:00 daily refresh) plus a daily
# pass at 06:40 UTC. HISTORY, so nobody re-introduces the bug: the weekly cron
# used to run with --limit 8 "to sweep only the most recent events", but the DB
# holds exactly 8 upcoming ufc.com events, and _get_target_events orders by
# event_date DESC — so the eight future cards ate the whole quota and the sweep
# never reached a single completed event, for months, in green. Raised to 40
# (the full ufc.com catalogue is 26) on 2026-08-01.
# REQUIRES migration db/migrations/009_fighter_standing_photo.sql applied first.
on:
  schedule:
    - cron: "0 7 * * 1"   # barrido semanal amplio
    # AÑADIDO EL 1-AGO-2026: pase diario tras el refresh de las 06:00Z. Las
    # fotos de una cartelera aparecen en ufc.com entre semana, segun se van
    # anunciando los combates; esperar al lunes siguiente significa llegar
    # despues de la velada.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max events to process, newest first (empty = all)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run: parse + match, no writes"
        type: boolean
        default: false

concurrency:
  group: backfill-standing
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Run standing-photo backfill
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # EL TOPE DE 8 NO TOCABA NI UN EVENTO CELEBRADO. Verificado contra
            # la BD el 1-ago-2026: _get_target_events ordena por event_date DESC
            # y hay EXACTAMENTE 8 eventos 'upcoming' de los 26 con
            # source='ufc.com'. Los ocho futuros se comian el cupo entero, cada
            # semana, asi que el barrido semanal jamas llegaba al 9º — pese a
            # que la cabecera de este fichero afirma lo contrario ("upcoming AND
            # completed"). Con 40 caben los 26 de hoy y sobra margen; el
            # dispatch manual del 11-jul hizo 24 eventos en 2 min, muy por
            # debajo del timeout de 30. Todo es aditivo: NULL nunca pisa un
            # valor guardado, asi que repetir es seguro.
            if [ "${{ github.event.schedule }}" = "40 6 * * *" ]; then
              ARGS="--limit 12"   # pase diario: los 8 futuros + los 4 recientes
            else
              ARGS="--limit 40"   # barrido semanal: todo el catalogo de ufc.com
            fi
          else
            if [ -n "${{ inputs.limit || '' }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
            if [ "${{ inputs.dry_run || false }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          python -m src.scrapers.backfill_standing_photos $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
