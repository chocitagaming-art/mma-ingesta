name: Live sentinel (arranca el directo solo)

# EL AGUJERO: `live-event-loop.yml` solo tiene dos crons de sabado (20:45 y
# 00:45 UTC). De los 8 eventos futuros con hora, esos slots no cubren ni el 1063
# (1-ago, prelims 14:00Z) ni el 1087 (8-ago). El 25-jul hubo que lanzarlo a mano,
# y el 1-ago se volvera a lanzar a mano: este centinela se estrena el 8-ago.
#
# POR QUE DUERME DENTRO DEL JOB en vez de usar un cron a la hora exacta: esta
# medido que el scheduler de GitHub da ~1 run/hora pidas lo que pidas, con un
# peor caso observado de 3h33 de retraso. Un cron de un solo uso no arranca
# cuando se le pide. Un `workflow_dispatch`, si — y el 26-jul-2026 se verifico
# que el GITHUB_TOKEN con `actions: write` puede lanzarlos (run 30203474005
# disparo el 30203478541, con actor `github-actions[bot]`).
#
# ANTI-DUPLICADO, Y POR QUE VA DESPUES DEL SUENO: comprobar antes de dormir es
# TOCTOU puro — entre la comprobacion y el disparo pasan horas. El 11-jul un
# dispatch de mas canceló un relevo, que es el modo de fallo real que esto evita.
#
# El 95 % de las ejecuciones salen verdes en segundos: no hay velada.

on:
  # ACTIVADO EL 1-AGO-2026, despues de que la velada del 1063 se perdiera entera
  # por no lanzarlo a mano. El motivo por el que estuvo apagado ya no existe: se
  # apago para que no coincidiera con el lanzamiento manual del 1-ago (un
  # dispatch de mas no se encola, CANCELA el relevo — el fallo del 11-jul), y a
  # partir de ahora NO habra lanzamiento manual. Es este o nada.
  #
  # HORARIO, no cada 2 h como decia el plan original. El motivo es aritmetico:
  # el `lookahead` es de 5 h y esta MEDIDO que el scheduler de GitHub sirve los
  # crons con huecos reales de 1h45 a 2h55 (muestreado el 1-ago sobre los runs
  # de live-results.yml, que pide */10), con un peor caso historico de 3h33. Con
  # cron cada 2 h, un hueco de 3h33 mas las 2 h nominales deja fuera la ventana
  # de 5 h y la velada se pierde. Pidiendo cada hora, el peor caso sigue
  # cayendo dentro. Sale gratis: sin velada el run muere en verde en segundos.
  #
  # NO subir `lookahead_hours` de 5: live_sentinel.py acota el sueno a
  # SUENO_MAXIMO_MINUTOS = 300, asi que con mas lookahead el centinela
  # despertaria antes de tiempo y lanzaria el bucle demasiado pronto.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      lookahead_hours:
        description: "Horas por delante que mira (no subir de 5)"
        default: "5"
      dry_run:
        description: "Calcula y enseña el plan, pero NO dispara nada"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  # Grupo propio: si un centinela ya esta durmiendo, el siguiente espera en vez
  # de ponerse a dormir en paralelo y disparar por duplicado.
  group: live-sentinel
  cancel-in-progress: false

jobs:
  centinela:
    runs-on: ubuntu-latest
    # Sueno maximo 300 min + margen para instalar y disparar. Tope duro: 360.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r requirements-scrapers.txt

      - name: Hay velada?
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PLAN=$(python -m scripts.live_sentinel \
            --lookahead-hours "${{ inputs.lookahead_hours || '5' }}" --json)
          echo "$PLAN"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "hay_evento=$(echo "$PLAN" | python -c 'import json,sys; print(str(json.load(sys.stdin)["hay_evento"]).lower())')" >> "$GITHUB_OUTPUT"

      - name: Sin velada — salir en verde
        if: steps.plan.outputs.hay_evento != 'true'
        run: echo "No hay velada en la ventana. Nada que hacer."

      - name: Dormir hasta 15 min antes del primer combate
        # En ENSAYO no se duerme: un ensayo con lookahead grande se quedaria
        # cinco horas ocupando un runner para no disparar nada al final. Se
        # descubrio en la primera prueba real (run 30203744406, cancelado a
        # mano), que es exactamente para lo que sirve ensayar.
        if: steps.plan.outputs.hay_evento == 'true' && inputs.dry_run != true
        run: |
          PLAN='${{ steps.plan.outputs.plan }}'
          SEG=$(echo "$PLAN" | python -c 'import json,sys; print(json.load(sys.stdin)["dormir_segundos"])')
          ARR=$(echo "$PLAN" | python -c 'import json,sys; print(json.load(sys.stdin)["arranque"])')
          echo "Durmiendo $((SEG / 60)) min, hasta $ARR"
          sleep "$SEG"

      - name: Ya hay un bucle corriendo?
        # DESPUES del sueno, nunca antes: entre la comprobacion y el disparo han
        # pasado horas y el estado pudo cambiar. Ademas GitHub solo mantiene UN
        # run pendiente por grupo de concurrency: un dispatch de mas no se
        # encola, CANCELA el relevo. Paso el 11-jul.
        id: guard
        if: steps.plan.outputs.hay_evento == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIVOS=$(gh run list -R "${{ github.repository }}" \
            -w live-event-loop.yml --limit 20 \
            --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          echo "runs del bucle vivos: $VIVOS"
          echo "vivos=$VIVOS" >> "$GITHUB_OUTPUT"
          if [ "$VIVOS" != "0" ]; then
            echo "::warning title=Centinela::Ya hay $VIVOS run(s) del bucle vivos. NO se dispara nada."
          fi

      - name: Lanzar el directo
        if: steps.plan.outputs.hay_evento == 'true' && steps.guard.outputs.vivos == '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLAN='${{ steps.plan.outputs.plan }}'
          leer() { echo "$PLAN" | python -c "import json,sys; print(json.load(sys.stdin)['$1'])"; }
          A=$(leer minutos_a); B=$(leer minutos_b)
          echo "Velada: $(leer nombre) — job A $A min, job B $B min"

          # A y B al mismo grupo de concurrency: B queda EN COLA y arranca solo
          # cuando A muere. Son exactamente 1 en curso + 1 pendiente, que es el
          # maximo que GitHub admite. Un tercero cancelaria el relevo.
          gh workflow run live-event-loop.yml -R "${{ github.repository }}" \
            -f duration_minutes="$A" -f interval_seconds=20 -f dates=""
          gh workflow run live-event-loop.yml -R "${{ github.repository }}" \
            -f duration_minutes="$B" -f interval_seconds=20 -f dates=""

          # La captura cruda es el unico plan B real: si el bucle fallara, sin
          # ella la serie de la velada se pierde para siempre.
          gh workflow run capture-live-samples.yml -R "${{ github.repository }}" \
            -f duration_minutes="$A" -f interval_seconds=120 -f dates=""
          gh workflow run capture-live-samples.yml -R "${{ github.repository }}" \
            -f duration_minutes="$B" -f interval_seconds=120 -f dates=""

          echo "### Directo lanzado" >> "$GITHUB_STEP_SUMMARY"
          echo "- **$(leer nombre)** (id $(leer event_id))" >> "$GITHUB_STEP_SUMMARY"
          echo "- bucle A ${A} min + relevo B ${B} min" >> "$GITHUB_STEP_SUMMARY"
          echo "- captura cruda A + B" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensayo — el plan, sin disparar
        if: steps.plan.outputs.hay_evento == 'true' && inputs.dry_run == true
        run: |
          echo 'ENSAYO — no se ha disparado nada. El plan era:'
          echo '${{ steps.plan.outputs.plan }}'
