name: Enrich headshots (ufc.com)

# Fills fighters.headshot_url (plus record/measurements/bio gaps) from ufc.com
# athlete pages. Default scope = only fighters on UPCOMING cards that still
# have a gap (headshot NULL/empty or 0-0-0 record), so a pass is small and
# fast (~1-2 min). Every UPDATE is additive (COALESCE, only fills NULLs) and
# the record is only written when the stored one is 0-0-0, so re-running is
# always safe. Placeholder/silhouette images are rejected by the
# _is_placeholder_image guard — the DB never stores ufc.com shadow images.
# DIARIO desde el 21-ago-2026 (antes: solo los lunes). Mismo motivo y mismo
# arreglo que se le hizo a enrich-fullbody el 1-ago, y por el mismo fallo:
# un luchador dado de alta entre semana llegaba a su velada sin cara.
# Paso el 18-ago con los CUATRO debutantes del 1086 (Wint, Kuse, Dorsainvil y
# Chatman): sus fichas nacieron el martes, el pase semanal habia corrido el
# lunes 17, y el siguiente caia el lunes 24 — DOS DIAS DESPUES de su combate.
# Hubo que recortarles la foto a mano de Tapology. Con cadencia diaria, ufc.com
# publico sus paginas entre el 19 y el 21 y las habriamos cogido solas.
# Las carteleras se anuncian y se caen entre semana, asi que el hueco cambia a
# diario y una foto que ufc.com publica el jueves no puede esperar al lunes.
#
# Repetirlo a diario no cuesta ni rompe nada: el pase por defecto solo mira
# luchadores de carteleras PROXIMAS que aun tengan hueco (1-2 min), cada UPDATE
# es aditivo (COALESCE, solo rellena NULLs) y el guard _is_placeholder_image
# sigue rechazando las siluetas. Cuando no falta ninguna foto, el pase no
# escribe nada y termina en segundos.
#
# El desfase de 30 min con enrich-fullbody (05:00) se mantiene a proposito: es
# para no pedirle a ufc.com dos barridos a la vez, no por horario.
# Manual dispatch remains for custom passes (--all sweeps the whole table).
on:
  schedule:
    - cron: "30 5 * * *"     # Diario 05:30 UTC: solo carteleras proximas
    - cron: "0 4 1 * *"      # F5: dia 1 de cada mes 04:00 UTC -> barrido --all
    # FIGHT-WEEK SECOND PASS, Thursday and Friday evening (22-oct-2026).
    # ufc.com uploads the fight-week batch (*_MM-DD.png, named after the event
    # date) on THURSDAY evening, after the 05:30 pass. S3 Last-Modified of the
    # originals, 13 cards from 1-aug to 24-oct-2026: first file always on the
    # Thursday, 16:19Z-22:20Z; batch complete by 19:51Z on 12 of 13 (22-aug:
    # 22:20-23:28Z); and a lone Friday upload at 17:04-20:31Z on 4 of the 12
    # past weeks, two of them debutants (Batbayar 29-aug, Luis Hernandez
    # 26-sep). The 05:30 cron really fires at 09:36-13:26Z (p50 10:30Z, 15
    # runs since 8-oct), so a debutant created from ESPN with no ESPN photo
    # kept the silhouette until Friday afternoon, and it was patched by hand
    # every Thursday night. On 22-oct the 05:30 pass ran at 10:30Z, the UFC 333
    # batch landed at 16:19-16:24Z, and the manual dispatch at 19:53Z (run
    # 39844015851: 2 gap fighters, 1 written) gave the debutant Asaf Chopurov
    # his CHOPUROV_ASAF_10-24.png. On 15-oct, same dispatch at 21:14Z: 4 gap
    # fighters, 3 written.
    # 20:30Z: after the batch even if GitHub ran it on time, and GitHub starts
    # evening crons late too (the 20:00Z slot of refresh-weighins fired 107-343
    # min late on 49 evenings since 3-sep, p50 156). So this lands ~22:15Z-
    # 02:15Z: after the Thursday batch, and on Friday still hours before a
    # Saturday card starts (14:00Z Abu Dhabi, 22:00Z US). 10 min before
    # backfill-standing's second pass so ufc.com is not crawled by both at once
    # (same idea as the 05:00/05:30 offset above).
    # It is not the "0 4 1 * *" string, so the step gives it the daily pass's
    # scope: upcoming cards, gap fighters only (p50 0.4 min), never --all.
    # tests/test_fight_week_photo_pass.py pins the day, the hour and the scope.
    - cron: "30 20 * * 4,5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max fighters to process (empty = all in scope)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run: resolve + report, no writes"
        type: boolean
        default: false
      all:
        description: "Whole-table scope: every fighter with a gap, not just upcoming cards"
        type: boolean
        default: false

concurrency:
  group: enrich-photos
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Run ufc.com headshot enrichment
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # F5: el cron mensual (dia 1) barre TODA la tabla; el semanal sigue
            # acotado a carteleras proximas. Ambos son aditivos (COALESCE).
            # Every other cron (the daily 05:30 and the Thursday/Friday 20:30
            # second pass) falls through with ARGS="": upcoming cards only.
            if [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then ARGS="--all"; fi
          else
            if [ -n "${{ inputs.limit || '' }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
            if [ "${{ inputs.dry_run || false }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.all || false }}" = "true" ]; then ARGS="$ARGS --all"; fi
          fi
          python -m src.scrapers.enrich_photos_ufc $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
