name: Notify on cron failure

# Los crons de DATOS no avisaban si fallaban: espn-history estuvo roto 5 días en
# silencio (bug SQL) sin que nadie se enterara. Este workflow se dispara cuando
# cualquiera de los crons de datos TERMINA; si su conclusión es 'failure', abre
# (o comenta en) UN único Issue con la etiqueta 'cron-failure' → GitHub le manda
# el email al dueño. Anti-spam: reutiliza el Issue abierto. No lo cierra solo (el
# dueño lo cierra al arreglar). Nota: workflow_run solo actúa desde la rama
# default (main). Los nombres deben coincidir EXACTO con el `name:` de cada
# workflow vigilado.
#
# SI CITAS ESTE FICHERO DESDE OTRO, HAZLO POR NOMBRE DE JOB O DE PASO, nunca por
# numero de linea. Este es el fichero que mas crece y el que mas se cita: el
# 16-ago-2026 se encontraron DIEZ citas suyas caducadas a la vez, repartidas por
# alert-selftest.yml, capture-live-samples.yml y live-event-loop.yml, apuntando
# a :45, :69, :78-88, :127, :133, :161 y :198 cuando el job `notify` estaba ya
# en la :109 y el job `cerrar` en la :294. Una cita caducada no rompe nada, y
# por eso muerde: manda al sitio equivocado justo a quien esta buscando por que
# no le ha llegado un email. Lo vigila
# `tests/test_workflow_guards.py::test_nadie_cita_notify_on_failure_por_numero_de_linea`.
on:
  workflow_run:
    workflows:
      - "Refresh upcoming events"
      - "Refresh rankings"
      - "Refresh odds"
      - "Refresh news"
      - "Refresh fighter records"
      - "Refresh fight officials"
      - "Refresh fight bonuses"
      - "Refresh weigh-ins"
      - "Enrich full-body photos"
      - "Enrich headshots (ufc.com)"
      - "Enrich fighter facts (ufc.com)"
      # Estos dos nombres estaban INCOMPLETOS y por tanto no casaban con ningún
      # workflow: llevaban desde su alta sin vigilar de verdad (el fallo de
      # espn-history del 14-jul pasó en silencio, y la lista de Issues con
      # etiqueta 'cron-failure' estaba vacía). Los sufijos son obligatorios.
      - "Enrich athlete finish stats (ufc.com)"
      - "ESPN fight history (Bellator/regionales)"
      # Su fallo es raro pero caro: si deja de commitear, GitHub desactiva TODOS
      # los crons del repo a los 60 días de inactividad.
      - "Keepalive commit"
      - "Match face-off videos"
      - "Refresh gyms (OSM)"
      - "Backfill standing photos"
      - "Backfill cards"
      - "Consolidate results (post-event)"
      - "Smoke: parseo contra fuentes reales"
      # Noche de evento: eran el ÚNICO punto ciego de esta alerta. Si el bucle
      # del directo revienta a mitad de un main card nadie se enteraba, y una
      # noche perdida no se recupera (el siguiente evento puede ser semanas
      # después). "Monitor web" NO va aquí: se autogestiona con su propio Issue
      # de etiqueta 'monitor', que además cierra solo al recuperarse.
      #
      # ⚠️ ESTA ENTRADA NO SIRVE DE NADA, y conviene saberlo antes de confiar en
      # ella (medido el 16-ago-2026, auditoría post-UFC 330). GitHub NO emite
      # `workflow_run` cuando el run lo lanzó un `workflow_dispatch` hecho con el
      # GITHUB_TOKEN, y el bucle SOLO se lanza así, desde live-sentinel.yml y
      # live-watchdog.yml. Se deja escrita a propósito, no es un descuido: el día
      # que alguien lo lance a mano (actor humano) o le devuelva un cron, la
      # entrada empieza a valer sola. El aviso de verdad lo da ahora un paso
      # `if: always() && job.status != 'success'` DENTRO de live-event-loop.yml,
      # que usa este mismo título para que el job `cerrar` de abajo lo recoja.
      - "Live event loop (ESPN)"
      - "Live results (ESPN)"
      - "QA data coverage"
      # Si el despliegue del microservicio falla, la web se queda sirviendo el
      # modelo anterior sin dar ningún error: fallo silencioso de manual.
      - "Deploy prediction service (Render)"
      # Faltaba, y ya costó: falló el 22-jul-2026 y estuvo tres días sin que
      # nadie se enterara. Ojo, no confundirlo con "Keepalive commit" (que sí
      # estaba en la lista): son workflows distintos. Si este deja de correr,
      # Render se duerme y la primera predicción del día tarda 42 s.
      - "Keep-alive prediction service"
      # Canario: falla a proposito cuando se lanza a mano, para poder comprobar
      # que esta alerta funciona de verdad sin esperar a que se rompa un cron.
      - "Alert self-test (canario)"
      # El unico vigilado que no comprueba que un PROCESO termine, sino que el
      # DATO sea coherente. Es la via por la que se habria cazado la pelea que
      # ESPN retiro en mitad del 1062 sin que nada fallara.
      - "Post-event review (coherencia del dato)"
      # AÑADIDOS EL 1-AGO-2026. El centinela es el UNICO automatismo que
      # garantiza que se grabe una velada, y era el unico critico SIN vigilar:
      # si su paso "Hay velada?" revienta (Neon caido, cambio de esquema), el
      # run sale en rojo y no lo lee nadie hasta el lunes.
      - "Live sentinel (arranca el directo solo)"
      # El plan B de la pelicula del combate.
      #
      # ⚠️ MISMO CASO QUE "Live event loop (ESPN)": letra muerta, y aqui esta
      # DEMOSTRADO con fallos reales. Esta captura fallo tres veces (runs
      # 31277648004 y 31277649060 el 8-ago, y 31908917812 el 16-ago con "The
      # hosted runner lost communication with the server") y no se abrio ni un
      # Issue ni corrio ni un run de este workflow. Se lanza siempre por
      # `workflow_dispatch` con el GITHUB_TOKEN desde el centinela y el
      # watchdog, y ese dispatch no emite `workflow_run`. El aviso lo da ahora
      # un paso dentro de capture-live-samples.yml.
      - "Capture live ESPN samples (recon)"
      # El que se entera de que la velada se esta perdiendo AHORA. Falla en rojo
      # A PROPOSITO cuando rescata, para que el fallo no vuelva a ser invisible.
      - "Watchdog del directo"
      # El que lee el panel de estado y falla en rojo cuando algo esta roto. Sin
      # vigilarlo, el unico que avisa seria el unico del que nadie se entera.
      - "Guardian del estado"
    types: [completed]

permissions:
  issues: write
  actions: read

# SIN concurrency, A PROPOSITO (quitado el 1-ago-2026). GitHub mantiene UN solo
# run pendiente por grupo: un tercer aviso no se encola, EXPULSA al que
# esperaba. A las 08:00-08:15Z coinciden refresh-records, refresh-news y
# enrich-athlete-stats, así que si Neon se cae los tres fallan juntos y solo se
# garantizaba el aviso de uno. El anti-spam de verdad lo da la reutilización del
# Issue abierto de cada workflow, no el serializar los avisos.

jobs:
  notify:
    # 'failure' NO es el unico final malo, y darlo por supuesto costo caro: el
    # 11-jul-2026 tres runs de live-event-loop acabaron en 'cancelled' (un
    # dispatch de mas expulsa al relevo en cola) y no se abrio ni un Issue. Un
    # 'timed_out' del bucle a mitad de main card es igual de grave.
    #
    # LA EXCEPCION DEL CENTINELA (anadida el 16-ago-2026, auditoria post-UFC
    # 330). Un 'cancelled' del centinela NO es un fallo: es como esta disenado.
    # El centinela duerme DENTRO del job hasta T-15min (live-sentinel.yml:93-104,
    # hasta 5 h) mientras su cron horario (live-sentinel.yml:39-40) sigue
    # encolando runs, y GitHub guarda UN solo run pendiente por grupo de
    # concurrency (live-sentinel.yml:55-59): cada hora el nuevo EXPULSA al
    # pendiente anterior. Ojo al matiz, que importa para entender que no se
    # pierde nada: con `cancel-in-progress: false` el dormilon NO se toca; el
    # cancelado es siempre el que esperaba en la cola sin haber ejecutado ni un
    # paso.
    #
    # MEDIDO minuto a minuto la noche del UFC 330: el centinela de las
    # 17:16:15Z (run 31897828461) durmio 3h59 y disparo sus cuatro dispatches a
    # las 21:15:04Z. Mientras dormia se cancelaron los crons de las 18:20:25Z
    # (run 31900854345) y las 19:18:05Z (run 31903523857). Este workflow abrio
    # el Issue #32 a las 19:18:17Z, y el segundo cancelado entro como COMENTARIO
    # MUDO a las 20:17:04Z; el job `cerrar` no lo cerro hasta las 21:15:23Z.
    # O sea: la alarma del centinela estuvo AMORDAZADA de 19:18 a 21:15, que es
    # exactamente la ventana previa a la velada y la unica hora del mes en que
    # ese aviso vale para algo (GitHub manda email al ABRIR un Issue, no al
    # comentar en uno que ya sigues). Mismo patron el 8-ago con el Issue #29
    # (abierto 18:29:59Z, cerrado 20:45:19Z, tres crons cancelados: 31269349845,
    # 31272068167 y 31274360454) y el 6-ago con el #25.
    #
    # SE COMPARA POR `path`, NO POR `name`. El payload de workflow_run trae
    # `path` (comprobado: la API de runs/31903523857 devuelve
    # '.github/workflows/live-sentinel.yml'). Cambiar el `name:` visible del
    # workflow romperia un if por nombre EN SILENCIO -volveria a abrirse el
    # Issue cada sabado de velada y nadie ataria el cabo-, mientras que el
    # nombre del fichero no se toca al retocar un titulo.
    #
    # LO QUE ESTA EXCEPCION CUESTA, dicho claro: un centinela cancelado A MANO o
    # por un fallo de infraestructura tampoco abre Issue. Por eso no se calla
    # del todo: el job `centinela_autocancelado` de mas abajo deja un ::notice
    # por cada cancelacion. En 242 runs del centinela solo ha habido 6
    # cancelados, y 5 son estas autocancelaciones; el sexto (30203744406,
    # 26-jul) lo paro el dueno a mano sabiendo lo que hacia.
    #
    # Ojo con la sintaxis: el `!` solo es seguro porque el escalar empieza por
    # `${{`. Si una linea de un `if:` empieza por `!`, YAML lo lee como etiqueta
    # y revienta con ConstructorError.
    if: >-
      ${{ contains(fromJSON('["failure","timed_out","cancelled"]'),
                   github.event.workflow_run.conclusion)
          && !(github.event.workflow_run.conclusion == 'cancelled'
               && github.event.workflow_run.path == '.github/workflows/live-sentinel.yml') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_URL: ${{ github.event.workflow_run.html_url }}
      WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Abrir o comentar Issue de fallo
        # UN HILO POR WORKFLOW, no uno global (cambiado el 1-ago-2026).
        #
        # EL FALLO QUE ARREGLA, encontrado el 1-ago: el Issue 16 llevaba abierto
        # desde las 11:07Z por un keepalive que YA se habia recuperado solo. Como
        # la busqueda cogia CUALQUIER Issue abierto con la etiqueta, todo fallo
        # nuevo de los 27 workflows vigilados se convertia en el comentario N de
        # ese hilo muerto. GitHub manda email al ABRIR un Issue, no al comentar
        # en uno que ya sigues: el canal de avisos entero estaba amordazado por
        # un Issue viejo, y nadie podia saberlo.
        #
        # Buscando por el titulo (que ahora lleva el nombre del workflow), un
        # Issue olvidado solo silencia los avisos DE SU PROPIO workflow. El
        # anti-spam se conserva: dos fallos seguidos del mismo cron siguen
        # siendo comentarios en su hilo.
        run: |
          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          TITULO="🔴 Cron fallando — $WF_NAME"
          BODY=$(printf '⛔ **%s** — el workflow **%s** ha terminado en `%s`.\n\n[Ver el run](%s)\n\n_(Alerta automática. Revisa el run, arréglalo y cierra este Issue: mientras siga abierto, los siguientes fallos de ESTE workflow serán comentarios y no te llegará un email nuevo.)_' "$STAMP" "$WF_NAME" "$WF_CONCLUSION" "$WF_URL")
          # jq externo (viene preinstalado en los runners): el `--jq` de gh no
          # admite `--arg`, y el titulo lleva el nombre del workflow, que puede
          # traer parentesis y barras. Comparacion exacta, no `--search`, que
          # hace busqueda difusa y casaria hilos de otros workflows.
          ISSUE=$(gh issue list --repo "$REPO" --label cron-failure --state open \
            --limit 100 --json number,title \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
          else
            gh label create cron-failure --repo "$REPO" --color D73A4A --description "Un cron de datos ha fallado" --force
            gh issue create --repo "$REPO" --title "$TITULO" --label cron-failure --body "$BODY"
          fi

  # ---------------------------------------------------------------------------
  # EL RASTRO DE LA EXCEPCION (anadido el 16-ago-2026, con el `if:` de arriba).
  #
  # El job `notify` se calla los 'cancelled' del centinela porque son su
  # funcionamiento normal, no una averia (el por que largo esta en su `if:`).
  # Pero apagar una alarma sin dejar rastro es exactamente como se pierden los
  # fallos de verdad: una cancelacion por concurrency y una cancelacion porque
  # alguien paro el run a mano o porque el runner perdio la comunicacion se ven
  # IGUAL desde aqui. Este job es la diferencia entre "no aviso" y "no consta".
  #
  # No manda email A PROPOSITO: serian dos o tres correos por noche de velada
  # (dos el 15-ago, tres el 8-ago), que es justo el ruido que se viene a quitar.
  # Deja un ::notice anotado en la pagina del run y una linea en el resumen, que
  # es donde se mira cuando algo no cuadra. Cuesta un runner de ~10 s y el repo
  # es PUBLICO, asi que sale gratis.
  #
  # COMO DISTINGUE UNA COSA DE LA OTRA, y esto es lo que hace que la excepcion
  # no sea una venda: un run expulsado por la concurrency NUNCA llega a arrancar
  # su job, asi que la API devuelve CERO jobs. Uno cancelado de verdad (a mano o
  # por el runner) ya tenia el job en marcha y aparece con sus pasos.
  # COMPROBADO el 16-ago-2026 contra los dos casos reales que hay:
  #   runs/31903523857/jobs (15-ago, expulsado por el cron) -> total_count 0
  #   runs/30203744406/jobs (26-jul, parado a mano)         -> total_count 1,
  #                                                            job 'centinela'
  #                                                            con 13 pasos.
  # Aqui SOLO se imprime el veredicto, no se abre ningun Issue: el `if:` de un
  # job `workflow_run` no se puede ensayar sin fusionar a main, asi que un
  # camino que CREA cosas no se mete a seis dias de la velada. Si mas adelante
  # se quiere que la cancelacion real si avise, este es el sitio y este es el
  # dato; el permiso `issues: write` ya esta concedido arriba.
  centinela_autocancelado:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'cancelled'
          && github.event.workflow_run.path == '.github/workflows/live-sentinel.yml' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Igual que `cerrar`: si esto falla se pierde una anotacion, no el canal de
    # avisos. Nunca puede tumbar el workflow que da las alarmas.
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WF_URL: ${{ github.event.workflow_run.html_url }}
      WF_ID: ${{ github.event.workflow_run.id }}
      WF_CREATED: ${{ github.event.workflow_run.created_at }}
    steps:
      - name: Dejar constancia de la autocancelacion del centinela
        run: |
          # `set +e` a proposito y sin `-o pipefail`: si la API de Actions
          # contesta mal, la anotacion basica tiene que salir igual. Perder el
          # veredicto es aceptable; perder el rastro entero no.
          set +e
          JOBS=$(gh api "repos/$REPO/actions/runs/$WF_ID/jobs" --jq '.total_count' 2>/dev/null)
          case "$JOBS" in
            0)
              VEREDICTO="AUTOCANCELACION NORMAL: el run no llego a arrancar ningun job, o sea que lo expulso el cron horario mientras otro centinela dormia. No hay nada que mirar."
              ;;
            ""|*[!0-9]*)
              VEREDICTO="NO SE HA PODIDO COMPROBAR si arranco el job (la API no contesto). Abre el run y mira si tiene pasos ejecutados: si los tiene, la cancelacion es real."
              ;;
            *)
              VEREDICTO="OJO: este run YA HABIA ARRANCADO su job ($JOBS job(s)), asi que NO lo expulso la concurrency. Lo paro alguien a mano o se cayo el runner, y eso hay que mirarlo."
              ;;
          esac
          echo "::notice title=Centinela::Run del centinela en 'cancelled' sin abrir Issue. $VEREDICTO $WF_URL"
          {
            echo "### Centinela cancelado — sin Issue a proposito"
            echo "- run creado a las \`$WF_CREATED\`, jobs arrancados: \`${JOBS:-?}\`"
            echo "- $VEREDICTO"
            echo "- [ver el run]($WF_URL)"
            echo "- Por que no abre Issue: el cron horario de live-sentinel.yml:39-40 expulsa al run pendiente mientras otro duerme (concurrency en live-sentinel.yml:55-59), y ese ruido amordazo la alarma del centinela de 19:18 a 21:15 la noche del UFC 330 (Issue #32)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # EL RELEVO: cerrar el Issue cuando el workflow vuelve a verde.
  #
  # Anadido el 6-ago-2026, y llega tarde. Este fichero ABRIA Issues y no cerraba
  # NINGUNO -su `if:` solo miraba failure/timed_out/cancelled-, asi que cada
  # aviso se quedaba abierto para siempre. Y el propio cuerpo del Issue explica
  # por que eso es grave: "mientras siga abierto, los siguientes fallos de ESTE
  # workflow seran comentarios y no te llegara un email nuevo". GitHub manda
  # correo al ABRIR, no al comentar.
  #
  # Medido el 6-ago: seis Issues abiertos, y tres correspondian a cosas ya
  # resueltas (#19 con el servicio en pie, #21 sin nada sin desplegar, #23 con la
  # fuente respondiendo en 0,2 s). El #19 llevaba casi tres dias abierto con su
  # cron en verde. Con la velada del sabado 8 encima, eso significaba que un
  # fallo del centinela del directo NO habria mandado ningun correo: habria sido
  # un comentario mudo dentro de un hilo viejo.
  #
  # No hace falta que nadie se acuerde de cerrarlos a mano. Ese era el fallo.
  cerrar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NUNCA hace fallar el run. Si el cierre no sale, se pierde una comodidad;
    # si tumbara el workflow, se perderia el canal de avisos entero.
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Cerrar el Issue de este workflow si ya vuelve a estar verde
        run: |
          set -uo pipefail
          TITULO="🔴 Cron fallando — $WF_NAME"
          # Mismo emparejamiento EXACTO por titulo que usa el job de arriba: con
          # `--search` la busqueda es difusa y cerraria el hilo de otro workflow.
          ISSUE=$(gh issue list --repo "$REPO" --label cron-failure --state open \
            --limit 100 --json number,title,labels \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t)] | .[0] | select(.) | @json')

          if [ -z "$ISSUE" ]; then
            echo "No hay Issue abierto para '$WF_NAME'. Nada que cerrar."
            exit 0
          fi

          NUM=$(echo "$ISSUE" | jq -r '.number')

          # SALVAVIDAS: hay Issues que NO se cierran aunque su cron vuelva a
          # verde, porque la condicion que los abrio sigue viva y son la unica
          # senal de que algo cambio en una fuente de fuera. El caso real es el
          # #22: ufc.com dejo de emitir `data-fmid` y el impacto esta mitigado
          # por diseno, asi que el smoke puede volver a pasar sin que el problema
          # se haya ido. Cerrarlo seria apagar la unica alarma que lo vigila.
          # Se marcan a mano con la etiqueta `no-cerrar-solo`.
          if echo "$ISSUE" | jq -e '.labels[]? | select(.name == "no-cerrar-solo")' >/dev/null; then
            echo "::notice title=Relevo::El Issue #$NUM lleva 'no-cerrar-solo'. Se deja abierto a proposito."
            exit 0
          fi

          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          # SE COMPRUEBA SI EL CIERRE HA SALIDO BIEN (16-ago-2026, revision
          # del arreglo del centinela). Aqui hay `set -uo pipefail` pero NO
          # `set -e`: sin este `if`, un `gh issue close` que falla (un 5xx,
          # rate limit, un token con permisos recortados) seguia de largo,
          # imprimia "Issue #N cerrado." y el paso salia con 0. Y como este
          # job lleva `continue-on-error: true`, el run entero se quedaba
          # VERDE contando una mentira mientras el Issue seguia ABIERTO.
          # Un Issue abierto de mas es precisamente la averia que este job
          # existe para evitar: GitHub manda email al ABRIR, no al comentar,
          # asi que el siguiente fallo de ESE workflow habria sido un
          # comentario mudo. Es el fallo del Issue 16 (1-ago) y el del #32
          # (15-ago) otra vez, escondido en la ultima linea del script.
          # Se anota con `::error` para que se vea en la pagina del run; el
          # `continue-on-error` del job impide que esto tumbe el canal.
          if gh issue close "$NUM" --repo "$REPO" --reason completed --comment "$(printf '✅ **%s** — **%s** ha vuelto a terminar en `success`, así que este aviso se cierra solo.\n\n[Ver el run](%s)\n\n_Se cierra para que el PRÓXIMO fallo de este workflow vuelva a abrir un Issue nuevo y te llegue un email. Mientras un aviso sigue abierto, los fallos siguientes son comentarios mudos._\n\n_Si este Issue no debe cerrarse aunque su cron pase, ponle la etiqueta `no-cerrar-solo`._' "$STAMP" "$WF_NAME" "$WF_URL")"; then
            echo "Issue #$NUM cerrado."
          else
            echo "::error title=Relevo::No se ha podido cerrar el Issue #$NUM de '$WF_NAME'. Sigue ABIERTO, y mientras lo este el proximo fallo de ese workflow sera un comentario sin email. Cierralo a mano."
            exit 1
          fi
