# T3-A: bucle ACOTADO de resultados en vivo para la noche de evento.
#
# El cron */10 de live-results.yml lo retrasa el scheduler de GitHub (medido
# 11-jul-2026: cadencia efectiva ~1 h). Este job arranca al inicio de cada
# ventana y SE QUEDA VIVO ~4 h haciendo una pasada cada ~20s con el mismo
# codigo idempotente (COALESCE, el valor almacenado gana). Una pasada es barata
# (~3 GETs durante un combate en directo), asi que 20s da sensacion de directo
# sin martillear ESPN. live-results.yml sigue activo como respaldo: solaparse es
# inocuo por construccion.
#
# Guard barato: si la primera pasada ve el scoreboard vacio (no hay evento en
# la ventana), el job sale en verde en segundos.
name: Live event loop (ESPN)

on:
  # SIN CRONS, A PROPOSITO — cambiado el 1-ago-2026. Este bucle solo se lanza
  # por `workflow_dispatch`, y solo desde live-sentinel.yml o live-watchdog.yml.
  #
  # POR QUE SE HAN QUITADO LOS DOS CRONS QUE HABIA ("45 20 * * 6" y
  # "45 0 * * 0"), que ademas era tentador AMPLIAR a cinco para cubrir las horas
  # reales de los 8 eventos futuros:
  #
  # 1. UN CRON CIEGO AQUI CANCELA EL RELEVO. GitHub mantiene UN unico run
  #    pendiente por grupo de concurrency. El centinela lanza A (en curso) + B
  #    (en cola); un tercer disparo NO se encola: expulsa a B. Es literalmente
  #    el fallo del 11-jul-2026, y con cinco crons de sabado pasaria casi cada
  #    semana, justo en mitad del estelar. Los dos unicos que disparan ahora
  #    comprueban antes que no haya ningun run vivo (guard 'vivos == 0'); un
  #    cron no puede comprobar nada.
  #
  # 2. NO APORTABAN COBERTURA. Medido contra la BD el 1-ago: de los 8 eventos
  #    futuros, los dos crons llegaban tarde a SIETE (405 min tarde al 1063,
  #    885 al 1065 — despues del final de la velada). Y esta medido que el
  #    scheduler sirve los crons con 1h45-2h55 de retraso, asi que ni siquiera
  #    llegaban cuando tocaba.
  #
  # 3. YA HAY TRES REDES MEJORES, y las tres miran antes de disparar:
  #      live-sentinel.yml  (cada hora) duerme hasta T-15min y lanza A + B
  #      live-watchdog.yml  (cada hora) si hay velada y NO entran muestras, rescata
  #      live-results.yml   (*/10 en sus ventanas) respaldo de resultados, job corto
  #    live-results.yml SI conserva sus crons: son jobs de 10 min que no encolan
  #    relevos, asi que no pueden cancelar nada.
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Duracion de la ventana en minutos"
        default: "235"
      interval_seconds:
        description: "Segundos entre pasadas (10-30 en directo; 20 por defecto)"
        default: "20"
      dates:
        description: "Filtro ESPN YYYYMMDD (opcional; por defecto hoy+ayer US Eastern)"
        default: ""
      dry_run:
        description: "Match + report sin escrituras"
        type: boolean
        default: false

# HACEN FALTA PARA QUE EL PROPIO BUCLE PUEDA ABRIR SU AVISO (ver el ultimo paso
# del job). El permiso por defecto del repo es `read` — comprobado el
# 16-ago-2026 con `gh api repos/.../actions/permissions/workflow`, que devuelve
# {"default_workflow_permissions":"read"} —, asi que sin este bloque el
# `gh issue create` se estrella con un 403 y el aviso vuelve a ser mudo.
# `contents: read` se declara EXPLICITAMENTE porque en cuanto se nombra un
# permiso los demas pasan a "none", y este job hace `actions/checkout`.
permissions:
  contents: read
  issues: write

concurrency:
  group: live-event-loop
  cancel-in-progress: false

jobs:
  live-loop:
    runs-on: ubuntu-latest
    # Margen sobre los 235 min por defecto; tope duro de GitHub: 360.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt

      - name: Install dependencies
        run: pip install -r requirements-scrapers.txt

      - name: Run bounded live loop
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # En los eventos schedule los inputs llegan vacios: defaults defensivos
        # con || (mismo patron que enrich-fullbody.yml).
        run: |
          ARGS="--duration-minutes ${{ inputs.duration_minutes || '235' }}"
          ARGS="$ARGS --interval-seconds ${{ inputs.interval_seconds || '20' }}"
          if [ -n "${{ inputs.dates }}" ]; then
            ARGS="$ARGS --dates ${{ inputs.dates }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "python -m src.scrapers.espn_live_results $ARGS"
          python -m src.scrapers.espn_live_results $ARGS

      - name: Consolidacion oportunista post-ventana (best-effort)
        # Primer tiro de backfill_results al cerrar la ventana del loop: si ufcstats
        # ya publico peleas tempranas del card, las consolida ~horas antes que el
        # cron consolidate-results. Idempotente y best-effort: si ufcstats aun esta
        # vacio o algo falla, no tumba el workflow (el cron escalonado lo cubre).
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.scrapers.backfill_results

      - name: Refresco de records post-ventana (best-effort)
        # Los records NO se mueven solos al sellar un combate: los actualiza el
        # cron diario de las 08:00 UTC. El 25-jul-2026, con 10 combates ya
        # resueltos, Rzepecki seguia figurando como invicto habiendo perdido esa
        # misma noche, y asi habria seguido 16 h. Al colgarlo del cierre de la
        # ventana la espera baja a ~1 h, que es lo que pidio el dueno.
        # --days 3 es de sobra para la velada recien terminada y mantiene el
        # trabajo acotado (ayer fueron 24 luchadores). Best-effort igual que el
        # paso de arriba: esto no puede tumbar la noche de directo.
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.scrapers.refresh_fighter_records --days 3

      # -----------------------------------------------------------------------
      # EL AVISO VIVE AQUI DENTRO, y no en notify-on-failure.yml.
      # Anadido el 16-ago-2026, en la auditoria de la noche siguiente a UFC 330.
      #
      # POR QUE NO BASTABA CON notify-on-failure.yml. Ese fichero escucha
      # `workflow_run`, y GitHub NO emite ese evento cuando el run lo lanzo un
      # `workflow_dispatch` hecho con el GITHUB_TOKEN (actor
      # `github-actions[bot]`): es el corta-recursion del token automatico. Este
      # bucle SOLO se lanza asi, desde el paso "Lanzar el bucle" del centinela y
      # el "Rescatar el bucle" del watchdog, de modo que su entrada en la lista
      # de vigilados
      # ("Live event loop (ESPN)", en el `on:` de notify-on-failure.yml) era
      # LETRA MUERTA
      # desde el dia que se escribio. Escrita, leida y falsa.
      #
      # LAS PRUEBAS, medidas el 16-ago-2026:
      #   - "Capture live ESPN samples (recon)" —hermano gemelo de este bucle, lo
      #     dispara el mismo paso del mismo centinela— ha fallado DE VERDAD tres
      #     veces: runs 31277648004 y 31277649060 (8-ago) y 31908917812 (16-ago,
      #     "The hosted runner lost communication with the server", en plena
      #     UFC 330). Cero Issues abiertos, cero runs de notify-on-failure.
      #   - CONTRAPRUEBA: el canario alert-selftest.yml tambien es
      #     `workflow_dispatch` puro, pero lo lanza una PERSONA. El run
      #     30174577725 (25-jul, 20:55:59Z) abrio el Issue #13 a las 20:56:16Z:
      #     17 segundos. La UNICA diferencia es quien dispara.
      #   - Y el 16-ago a las 00:51:26Z este bucle termino en `success`; el run
      #     de notify-on-failure de las 00:52:00Z no venia de aqui, venia de
      #     "Keep-alive prediction service" (leido en su log). Ni siquiera los
      #     exitos emiten el evento.
      #
      # MISMO TITULO Y MISMA ETIQUETA que el paso `Abrir o comentar Issue de
      # fallo` de notify-on-failure.yml, A PROPOSITO.
      # Asi hay UN solo hilo por workflow: si algun dia alguien lanza el bucle a
      # mano (actor humano => el evento SI se emite), el job `cerrar` de
      # notify-on-failure.yml recoge este mismo Issue sin tocar nada. Un titulo
      # propio habria creado un segundo convenio de avisos que nadie cierra.
      #
      # `always() && job.status != 'success'` Y NO `failure()`: 'failure' no es
      # el unico final malo, y darlo por supuesto ya costo caro. El 11-jul-2026
      # tres runs de ESTE bucle acabaron en `cancelled` (un dispatch de mas
      # expulsa al relevo en cola) y no se entero nadie. Un `timed_out` a mitad
      # del estelar es igual de grave. Ademas `always()` es lo unico que hace que
      # el paso llegue a ejecutarse cuando el job se cancela o agota su
      # `timeout-minutes`: un `if: failure()` seco se salta en esos dos casos.
      #
      # ULTIMO PASO A PROPOSITO, misma logica que el ultimo paso del watchdog: la
      # consolidacion y el refresco de records de arriba se intentan ANTES de
      # avisar. Primero se salva lo que se pueda, luego se molesta al dueno.
      - name: Avisar si el bucle no ha terminado bien
        if: ${{ always() && job.status != 'success' }}
        # NUNCA convierte un fallo en dos. Si el aviso no sale, se pierde el
        # correo; si ademas tumbara el paso, ensuciaria el diagnostico del fallo
        # de verdad, que es lo que hay que leer esa noche.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # `github.workflow` rinde EXACTAMENTE el `name:` de arriba
          # ("Live event loop (ESPN)"), que es la misma cadena que
          # notify-on-failure saca de `github.event.workflow_run.name`. Si
          # alguien cambia el `name:`, el titulo le sigue solo.
          WF_NAME: ${{ github.workflow }}
          WF_ESTADO: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          TITULO="🔴 Cron fallando — $WF_NAME"
          BODY=$(printf '⛔ **%s** — el workflow **%s** ha terminado en `%s`.\n\n[Ver el run](%s)\n\n_(Alerta automática. Revisa el run, arréglalo y cierra este Issue: mientras siga abierto, los siguientes fallos de ESTE workflow serán comentarios y no te llegará un email nuevo.)_' "$STAMP" "$WF_NAME" "${WF_ESTADO:-failure}" "$RUN_URL")
          # jq externo y comparacion EXACTA por titulo, calcado de
          # su paso `Abrir o comentar Issue de fallo`: `--search` hace busqueda
          # difusa y casaria
          # el hilo de OTRO workflow (el nombre lleva parentesis).
          ISSUE=$(gh issue list --repo "$REPO" --label cron-failure --state open \
            --limit 100 --json number,title \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "$BODY"
          else
            gh label create cron-failure --repo "$REPO" --color D73A4A --description "Un cron de datos ha fallado" --force
            gh issue create --repo "$REPO" --title "$TITULO" --label cron-failure --body "$BODY"
          fi

      # EL RELEVO, TAMBIEN AQUI DENTRO, y por el mismo motivo que el aviso.
      #
      # El job `cerrar` de notify-on-failure.yml NO puede cerrar este Issue:
      # se dispara con el mismo `workflow_run` que tampoco llega hasta aqui.
      # Sin este paso, el primer fallo dejaria un Issue abierto PARA SIEMPRE y el
      # siguiente fallo seria un comentario mudo — que es literalmente la averia
      # del Issue 16 (1-ago-2026): GitHub manda correo al ABRIR, no al comentar.
      # Abrir avisos sin cerrarlos es peor que no avisar, porque parece que
      # funciona.
      #
      # Respeta `no-cerrar-solo` igual que el salvavidas del job `cerrar` de
      # notify-on-failure.yml, para que
      # los dos cierres se comporten IGUAL y no haya que recordar cual es cual.
      #
      # SOBRE EL RELEVO A+B: el centinela lanza dos runs, A en curso y B en cola.
      # Si A muere y B arranca despues y va bien, B cerrara el Issue que abrio A.
      # Es lo correcto y esta pensado: el correo ya se mando al abrirlo, el dueno
      # ya se entero, y dejarlo abierto amordazaria el aviso de la semana que
      # viene. Si un aviso concreto no debe cerrarse, se le pone la etiqueta.
      - name: Cerrar el aviso si el bucle ha ido bien
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITULO="🔴 Cron fallando — $WF_NAME"
          ISSUE=$(gh issue list --repo "$REPO" --label cron-failure --state open \
            --limit 100 --json number,title,labels \
            | jq -r --arg t "$TITULO" '[.[] | select(.title == $t)] | .[0] | select(.) | @json')

          if [ -z "$ISSUE" ]; then
            echo "No hay Issue abierto para '$WF_NAME'. Nada que cerrar."
            exit 0
          fi

          NUM=$(echo "$ISSUE" | jq -r '.number')

          if echo "$ISSUE" | jq -e '.labels[]? | select(.name == "no-cerrar-solo")' >/dev/null; then
            echo "::notice title=Relevo::El Issue #$NUM lleva 'no-cerrar-solo'. Se deja abierto a proposito."
            exit 0
          fi

          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          # SE COMPRUEBA SI EL CIERRE HA SALIDO BIEN (16-ago-2026). Aqui hay
          # `set -uo pipefail` pero NO `set -e`: sin este `if`, un `gh issue
          # close` que falla (un 5xx, rate limit, un token con permisos
          # recortados) seguia de largo, imprimia "Issue #N cerrado." y salia
          # con 0. La noche de la velada eso significa que el Issue del bucle
          # se queda ABIERTO creyendo que se cerro, y a partir de ahi todos los
          # fallos del bucle son comentarios mudos: el mma-app#20 (15-ago) otra
          # vez, escondido en la ultima linea del script. Se anota con `::error`
          # para que se vea en la pagina del run; el `continue-on-error` del
          # paso impide que esto tumbe el bucle.
          if gh issue close "$NUM" --repo "$REPO" --reason completed --comment "$(printf '✅ **%s** — **%s** ha vuelto a terminar en `success`, así que este aviso se cierra solo.\n\n[Ver el run](%s)\n\n_Se cierra para que el PRÓXIMO fallo de este workflow vuelva a abrir un Issue nuevo y te llegue un email. Mientras un aviso sigue abierto, los fallos siguientes son comentarios mudos._\n\n_Si este Issue no debe cerrarse aunque su cron pase, ponle la etiqueta `no-cerrar-solo`._' "$STAMP" "$WF_NAME" "$RUN_URL")"; then
            echo "Issue #$NUM cerrado."
          else
            echo "::error title=Relevo::No se ha podido cerrar el Issue #$NUM de '$WF_NAME'. Sigue ABIERTO, y mientras lo este el proximo fallo del bucle sera un comentario sin email. Cierralo a mano."
            exit 1
          fi
