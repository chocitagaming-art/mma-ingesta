name: Enrich full-body photos

# Fills fighters.full_body_url, leg_reach_cm and trains_at from ufc.com athlete
# pages. The pass walks every fighter still missing one of the three columns
# (slug guessed from the name; ranked + upcoming + with-headshot fighters first)
# at a 0.4s delay, every UPDATE is additive (COALESCE, only fills NULLs), and
# pages whose rendered name does not match the DB fighter are skipped
# (anti-homonym guard), so every run is safe and resumes whatever gap is left.
# Weekly cron (Mondays 05:00 UTC, owner request 11-jul): newcomers' half-body
# photos used to depend on a manual dispatch — now they land on their own as
# soon as ufc.com publishes them. The scheduled pass runs with no args (full
# gap sweep; fighters with no ufc.com page are skipped again each week, ~10
# min, well under the timeout). Manual dispatch remains for custom passes.
# REQUIRES migration db/migrations/008_fighter_bio_extras.sql applied first.
on:
  schedule:
    # DIARIO desde el 1-ago-2026 (antes: solo los lunes). Es el UNICO cron que
    # rellena full_body_url — medido el origen de la columna en la BD: ufc.com
    # 1914, NULL 938, ESPN 0. Con el pase semanal, un luchador dado de alta el
    # miercoles llegaba al sabado sin foto: paso con NUEVE de los 30 que
    # pelearon el 1-ago, todos debutantes o poco conocidos. Los combates se
    # anuncian y se caen entre semana, asi que el hueco de una cartelera cambia
    # a diario y una foto que ufc.com publica el jueves no puede esperar cinco
    # dias. Repetirlo no puede romper nada: cada UPDATE es aditivo (COALESCE,
    # solo rellena NULLs) y las fichas sin pagina en ufc.com se saltan igual.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max fighters to process (empty = all)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run: resolve + report, no writes"
        type: boolean
        default: false
      solo_ufc:
        description: "Old scope: only fighters whose headshot is already from ufc.com"
        type: boolean
        default: false

concurrency:
  group: enrich-fullbody
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Run full-body enrichment backfill
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ -n "${{ inputs.limit || '' }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
            if [ "${{ inputs.dry_run || false }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.solo_ufc || false }}" = "true" ]; then ARGS="$ARGS --solo-ufc"; fi
          fi
          python -m src.scrapers.enrich_fullbody $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
