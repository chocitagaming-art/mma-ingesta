name: Refresh fight bonuses

# Fase 4 / BE3: scrapes the "Bonus awards" section of each completed event's
# English-Wikipedia article (FOTN / POTN) into fight_bonuses. Idempotent —
# INSERT ... ON CONFLICT DO NOTHING and the lookback skips events that already
# have bonuses — so re-dispatching is always safe.
# Weekly cron (Mondays 08:00 UTC, after the 06:00 daily refresh and the 07:00
# standing-photos sweep): UFC events run Saturday night and their Wikipedia
# bonus section lands within hours, so Monday covers the weekend card.
# REQUIRES migration db/migrations/010_fase4.sql applied first.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Completed events within this many days (default 30)"
        required: false
        default: ""
      event_id:
        description: "Process only this event id (overrides lookback)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run: parse + match, no writes"
        type: boolean
        default: false

concurrency:
  group: refresh-bonuses
  cancel-in-progress: false

jobs:
  bonuses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Run bonus scraper
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ -n "${{ inputs.lookback_days || '' }}" ]; then ARGS="$ARGS --lookback-days ${{ inputs.lookback_days }}"; fi
            if [ -n "${{ inputs.event_id || '' }}" ]; then ARGS="$ARGS --event-id ${{ inputs.event_id }}"; fi
            if [ "${{ inputs.dry_run || false }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          python -m src.scrapers.wiki_bonuses $ARGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
