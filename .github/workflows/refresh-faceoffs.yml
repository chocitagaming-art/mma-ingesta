name: Match face-off videos

# Matches each upcoming event to its official UFC "Fighter Face-offs" (careo)
# video from the channel RSS and stores the id (migration 022). Careos publish
# the evening before an event (US), so a daily run at 20:00 UTC catches them the
# day before / day of. Match is conservative (city or "UFC <N>" token +
# "face-off" title + date window) and first-writer-wins (idempotent).
#
# RESCUE PASS: if the optional YOUTUBE_API_KEY secret is set, a second pass pages
# the channel uploads playlist (playlistItems, 1 quota unit/page) to rescue
# careos of recently-passed events that already fell out of the ~15-video RSS
# window. Without the secret the job runs RSS-only, exactly as before.
# See match_faceoffs.py. Needs DATABASE_URL (+ optional YOUTUBE_API_KEY).
on:
  schedule:
    - cron: "0 20 * * *" # diario 20:00 UTC (víspera de los eventos, tarde US)
    # SEGUNDA PASADA a las 23:00 UTC. Con solo la de las 20:00, un careo que la
    # UFC publique el VIERNES después de esa hora no se recogía hasta el sábado
    # a las 20:00 — y una velada del APEX arranca a las 00:00 UTC del domingo,
    # así que el careo llegaba con la velada ya encima. Tres horas de margen
    # cubren la franja en la que el canal publica de verdad (tarde-noche US).
    # Es idempotente (first-writer-wins) y el `concurrency` de abajo impide que
    # las dos pasadas se pisen, así que repetir no cuesta nada.
    - cron: "0 23 * * *"
    # TERCERA Y CUARTA PASADA (21-ago-2026), para cerrar la ZONA MUERTA DE 21 h.
    # Medido sobre los 30 ultimos runs: el cron de las 20:00 arranca de verdad
    # entre 20:29 y 20:53 UTC, y el de las 23:00 entre 23:10 y 23:31. Entre la
    # pasada del viernes noche y la del sabado por la tarde pasaban 21,3 HORAS
    # REALES sin mirar — y esa franja es justo cuando la UFC publica el careo de
    # una velada de sabado (viernes noche hora de EEUU = madrugada UTC).
    # Ya costo un careo por diez minutos.
    #
    # 02:00 coge la publicacion de la noche del viernes en EEUU; 11:00 es la
    # segunda oportunidad de la manana antes de que llegue la de las 20:00.
    # Hueco maximo: ~9 h en vez de 21. Cuesta 16 unidades de cuota de YouTube por
    # pasada sobre un tope diario de 10.000, o sea nada, y sigue siendo
    # first-writer-wins: una pasada de mas no puede pisar un careo ya escrito.
    - cron: "0 2 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: match-faceoffs
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scrapers.txt
      - run: pip install -r requirements-scrapers.txt
      - name: Match face-off videos to upcoming events
        run: python -m src.scrapers.match_faceoffs --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: enables the API rescue pass. Absent -> RSS-only (no error).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
