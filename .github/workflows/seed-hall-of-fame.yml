name: Seed Hall of Fame

# Aplica las migraciones del Salón (014 y 031, aditivas e idempotentes), seedea el
# Salón de la Fama (src/scrapers/seed_hall_of_fame.py) y mide qué fotos vienen
# recortadas (src/scrapers/measure_photo_cutout.py).
#   - 014: ADD COLUMN IF NOT EXISTS bio.
#   - 031: video_id/video_start/video_end y photo_focus en hall_of_fame, y la tabla
#     photo_cutout (con su GRANT a mma_app_readonly).
#   - El seed: upsert idempotente por (wing, display_name) que refresca los enlaces
#     a fighters y escribe subtitle/photo_url/photo_focus/bio y el vídeo de cada
#     pelea del Ala de Combate. El seed MANDA: lo editado a mano en esas columnas
#     se pisa en la siguiente ejecución.
#   - La medida: descarga solo las fotos del Salón que no se han medido, que tienen
#     más de 30 días o cuya última descarga falló, y hace upsert en photo_cutout.
#     Un fallo pasajero no pisa un veredicto bueno, y el paso sale en ROJO si alguna
#     foto falló por algo que no sea 404/410: re-lanzar el workflow la reintenta.
# Manual (workflow_dispatch): re-ejecutar es siempre seguro. Requiere la migración
# 013 ya aplicada (tabla hall_of_fame). Escribe a la BD de prod
# (secrets.DATABASE_URL), como los demás refresh-*/enrich-* workflows.
#
# Al final invalida la caché de la web (/api/revalidate, tag 'hall-of-fame'): sin
# eso el Salón tardaría hasta 1 día en enseñar lo nuevo. 🪤 El tag solo lo invalida
# la web del rediseño (18-oct-2026); con la web anterior la llamada responde 200 y
# refresca el resto de tags, pero no el Salón. Orden de despliegue: ver la cabecera
# de db/migrations/031_salon_video_recortes.sql.
on:
  workflow_dispatch:

concurrency:
  group: seed-hall-of-fame
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # El seed solo necesita el driver de Postgres y dotenv (config = dataclass +
      # dotenv; matching = stdlib). La medida de fotos añade requests (descarga) y
      # Pillow (canal alfa); Pillow está en requirements-scrapers.txt para el CI.
      - run: pip install psycopg2-binary python-dotenv requests pillow
      - name: Apply migration 014 (additive, idempotent)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/014_hall_of_fame_bio.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Apply migration 031 (additive, idempotent)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/031_salon_video_recortes.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed Hall of Fame
        id: seed
        run: python -m src.scrapers.seed_hall_of_fame
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Measure photo cutouts
        run: python -m src.scrapers.measure_photo_cutout
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Revalidate web
        # Si el seed escribió, la web debe verlo aunque la medida haya salido en
        # rojo (por eso el if). Y que un fallo de la web no tape el resultado del
        # seed: continue-on-error, como en refresh-news.yml.
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://mmastatus.app/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -o /dev/null -w "revalidate: HTTP %{http_code}\n"
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
