name: Alert self-test (canario)

# Canario de la cadena de alertas. Falla A PROPOSITO, y solo cuando se lanza a
# mano: no tiene cron y no toca la base de datos ni la red.
#
# POR QUE EXISTE: el 25-jul-2026 se midio que notify-on-failure llevaba 86
# ejecuciones seguidas en 'skipped', CERO Issues con etiqueta cron-failure en
# toda su historia y la etiqueta ni siquiera creada. Es decir: el codigo que
# abre el Issue (notify-on-failure.yml:78-88) nunca se habia ejecutado ni una
# sola vez. Una alerta que nunca ha sonado no es una alerta, es una suposicion.
# Y la fase 1 del plan —hacer que el bucle del directo falle en rojo— solo vale
# algo si alguien se entera del rojo; sin esta prueba, el cambio solo habria
# convertido un fallo silencioso en verde en otro igual de silencioso en rojo.
#
# USO
#   gh workflow run alert-selftest.yml -R chocitagaming-art/mma-ingesta
# Debe quedar en rojo y, un minuto despues, aparecer un Issue con etiqueta
# cron-failure (o un comentario nuevo, si ya hay uno abierto). Cerrar el Issue
# al terminar: notify-on-failure REUTILIZA el Issue abierto y nunca lo cierra
# solo, asi que uno olvidado degrada los avisos de los 25 workflows vigilados a
# comentarios en un hilo que ya nadie lee.
on:
  workflow_dispatch:

jobs:
  fallar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fallar a proposito
        run: |
          echo "Canario de la cadena de alertas: este fallo es DELIBERADO."
          echo "Si ves este run en rojo, es que hizo su trabajo."
          exit 1
